<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>光電時光機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap"></noscript>
<script src="tailwind-3.4.17.js"></script>
<script>
if (window.tailwind) tailwind.config = { theme: { extend: {
  colors: { paper: "#F7F5F0", line: "#E2DFD7", mist: "#EAE6DF", ink: "#1C1D1B", ink2: "#64635E", brand: { DEFAULT: "#283D32", hover: "#1E2E25" }, accent: "#9C6B43", up: "#B0503A", down: "#2F5D46" },
  fontFamily: { sans: ["Inter", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "system-ui", "sans-serif"] }
} } };
</script>
</head>
<body>
<main id="app" class="gutter mx-auto max-w-xl space-y-5 pb-16 pt-4"></main>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="game.js"></script>
<script type="module">
import { createFirebaseStore } from "./firebase-store.js";
TM.injectCSS();
const app = document.getElementById("app");
const gid = new URLSearchParams(location.search).get("g");
const msg = (t, d) => { app.innerHTML = TM.ui.card(`<h1 class="text-2xl font-bold">${t}</h1><p class="mt-2 text-base text-ink2">${d}</p>`); };
if (!gid) msg("請掃描台上的 QR code", "這個網址少了遊戲代碼。");
else if (!window.TM_FIREBASE || !TM_FIREBASE.apiKey) msg("遊戲尚未設定", "主辦組還沒有填好 Firebase 設定。");
else {
  app.innerHTML = `<p class="py-10 text-center text-ink2">連線中…</p>`;
  try { const store = await createFirebaseStore(TM_FIREBASE); TM.mountPlayer(app, store, gid.toUpperCase()); }
  catch (e) { console.error(e); msg("連線失敗", "請確認網路後重新整理這一頁。"); }
}
</script>
</body>
</html>
